[project]
name = "comfyui-fal"
description = "FAL nodes ComfyUI doesn't have yet: image→3D (Tripo/Hunyuan3D/Trellis, no GPU), Bria background, the full 2026 Topaz family (Wonder/Bloom/precision in one gated node), and an Image Edit bar (object removal, erasers, inpaint, edit, upscale, expand — newest models with prices in the node names), plus a folder-IO bar (upload a folder of photos from the browser, get one ZIP back), a model-catalog registry and a new-model checker. Coexists with gokayfem/ComfyUI-fal-API."
version = "0.7.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fal-client"]

[project.optional-dependencies]
# HEIC/HEIF (iPhone) input for the folder loader. Everything else works without it.
heif = ["pillow-heif"]

[project.urls]
Repository = "https://github.com/dufok/ComfyUI-FAL"

[tool.comfy]
# PublisherId must match your Comfy Registry publisher account (https://registry.comfy.org).
PublisherId = "dufok"
DisplayName = "ComfyUI-FAL"
Icon = ""
